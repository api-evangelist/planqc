name: Planqc
description: >-
  planqc GmbH is a German quantum computing company building neutral-atom quantum
  computers, using individual atoms trapped in optical lattices as qubits on what it
  describes as the most promising path to fault-tolerant, scalable systems. Founded in
  2022 as a spin-off of the Max Planck Institute of Quantum Optics and Ludwig
  Maximilian University of Munich, the company delivers full-stack quantum computing —
  hardware, control software, and applications — including its MAQCS (Multicore Atomic
  Quantum Computing System) line for enterprise and scientific customers across
  aerospace, automotive, energy, and financial services. planqc operates from Garching
  and Ulm in Germany and Innsbruck in Austria, and is backed by investors including
  Speedinvest. As of this profile the company exposes no public developer API, SDK,
  developer portal, or programmatic cloud-access surface; access is arranged directly
  through the company. This profile is a portfolio-lead stub in the API Evangelist
  network, enriched with verified public identity and a domain-security probe.
